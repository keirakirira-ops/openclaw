name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tags and versions
        id: resolve
        run: |
          # Retrieve version from package.json
          VERSION=$(node -p "require('./package.json').version")
          
          # Retrieve short commit SHA
          SHA=$(git rev-parse --short HEAD)
          
          # Target image name lowercased to handle any case variation in repository paths
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          IMAGE_BASE_LOWER="${IMAGE_BASE,,}"
          
          # Output tag lists for the main image and the sandbox image
          echo "tags=${IMAGE_BASE_LOWER}:latest,${IMAGE_BASE_LOWER}:${VERSION},${IMAGE_BASE_LOWER}:${VERSION}-${SHA}" >> $GITHUB_OUTPUT
          echo "sandbox_tags=${IMAGE_BASE_LOWER}-sandbox:latest,${IMAGE_BASE_LOWER}-sandbox:${VERSION},${IMAGE_BASE_LOWER}-sandbox:${VERSION}-${SHA}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.resolve.outputs.tags }}
          build-args: |
            OPENCLAW_EXTENSIONS=diagnostics-otel,codex
          cache-from: type=gha,scope=openclaw-main
          cache-to: type=gha,mode=max,scope=openclaw-main

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/docker/sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.resolve.outputs.sandbox_tags }}
          cache-from: type=gha,scope=openclaw-sandbox
          cache-to: type=gha,mode=max,scope=openclaw-sandbox
